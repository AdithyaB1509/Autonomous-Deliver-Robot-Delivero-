ekf_filter_node:
  ros__parameters:
    frequency: 20.0
    two_d_mode: true
    publish_acceleration: false
    publish_tf: true

    map_frame: map
    odom_frame: odom
    base_link_frame: base_link
    world_frame: odom

    # rf2o: velocity only, NO position (position causes jumps)
    odom0: /odom_rf2o
    odom0_config: [false, false, false,
                   false, false, false,
                   true,  false,  false,   # vx, vy velocity only
                   false, false, false,
                   false, false, false]
    odom0_queue_size: 10
    odom0_nodelay: true
    odom0_differential: true              # ← key: treat as velocity source

    # Wheel encoders: linear X velocity only
    odom1: /odom_wheels
    odom1_config: [false, false, false,
                   false, false, false,
                   false, false, false,
                   false, false, false,
                   false, false, false]
    odom1_queue_size: 10
    odom1_nodelay: true
    odom1_differential: true              # ← key: treat as velocity source

    # IMU: yaw orientation + yaw rate (the only "truth")
    imu0: /imu/data
    imu0_config: [false, false, false,
                  false, false, false,
                  false, false, false,
                  false, false, true,
                  false, false, false]
    imu0_relative: true
    imu0_nodelay: true
    imu0_queue_size: 10
    imu0_remove_gravitational_acceleration: true

    transform_time_offset: 0.0
    transform_timeout: 0.05
    print_diagnostics: false