/slam_toolbox:
  ros__parameters:
    angle_variance_penalty: 1.0
    base_frame: base_link
    ceres_dogleg_type: TRADITIONAL_DOGLEG
    ceres_linear_solver: SPARSE_NORMAL_CHOLESKY
    ceres_loss_function: None
    ceres_preconditioner: SCHUR_JACOBI
    ceres_trust_strategy: LEVENBERG_MARQUARDT
    coarse_angle_resolution: 0.0349
    coarse_search_angle_offset: 0.349
    correlation_search_space_dimension: 0.5
    correlation_search_space_resolution: 0.01
    correlation_search_space_smear_deviation: 0.1
    debug_logging: false
    distance_variance_penalty: 0.5
    do_loop_closing: true
    enable_interactive_mode: true
    fine_search_angle_offset: 0.00349
    interactive_mode: false
    link_match_minimum_response_fine: 0.45   # ← raised from 0.1 (was too loose)
    link_scan_maximum_distance: 5.0          # ← reduced from 7.0
    loop_match_maximum_variance_coarse: 3.0
    loop_match_minimum_chain_size: 10
    loop_match_minimum_response_coarse: 0.35
    loop_match_minimum_response_fine: 0.35
    loop_search_maximum_distance: 5.0
    loop_search_space_dimension: 8.0
    loop_search_space_resolution: 0.05
    loop_search_space_smear_deviation: 0.03
    map_file_name: ''
    map_frame: map
    map_name: /map
    map_start_pose: [0.0, 0.0, 0.0]
    map_update_interval: 3.0                 # ← raised from 1.0 (less rebuilds)
    min_pass_through: 2
    minimum_angle_penalty: 1.0
    minimum_distance_penalty: 0.5
    minimum_time_interval: 0.5               # ← raised from 0.2
    minimum_travel_distance: 0.3             # ← reduced from 0.5
    minimum_travel_heading: 0.15             # ← reduced from 0.3
    mode: mapping
    occupancy_threshold: 0.1
    odom_frame: odom
    paused_new_measurements: false
    paused_processing: false
    position_covariance_scale: 1.0
    resolution: 0.05                         # ← reduced from 0.10 (sharper map)
    scan_buffer_maximum_scan_distance: 5.0
    scan_buffer_size: 20                     # ← raised from 10
    scan_queue_size: 1
    scan_topic: /scan
    solver_plugin: solver_plugins::CeresSolver
    tf_buffer_duration: 30.0
    throttle_scans: 1                        # ← reduced from 3 (use every scan)
    transform_publish_period: 0.02
    transform_timeout: 0.2                   # ← raised from 0.1
    use_map_saver: true
    use_response_expansion: true
    use_scan_barycenter: true
    use_scan_matching: true
    use_sim_time: false
    yaw_covariance_scale: 1.0